name: Test Coverage

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Run coverage
        run: |
          cargo tarpaulin \
            --workspace \
            --out xml \
            --output-dir coverage \
            --timeout 600 \
            --exclude-files "tests/*" "fuzz/*" "contracts/benches/*" "example/*" \
            --engine llvm \
            --no-fail-fast \
            2>&1 | tee coverage/tarpaulin.log

      - name: Parse per-contract coverage
        id: parse
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          import os, sys

          tree = ET.parse("coverage/cobertura.xml")
          root = tree.getroot()

          # Tarpaulin Cobertura XML: root element is <coverage>, packages
          # use directory paths as names (e.g. "contracts/audit/src").
          # Aggregate line hits/totals by contract name for accurate rates.
          contract_hits = {}
          contract_total = {}
          for package in root.findall(".//package"):
              name = package.get("name", "")
              if not name.startswith("contracts/"):
                  continue
              parts = name.split("/")
              if len(parts) < 2:
                  continue
              contract = parts[1]
              for line in package.findall(".//line"):
                  contract_total[contract] = contract_total.get(contract, 0) + 1
                  if int(line.get("hits", "0")) > 0:
                      contract_hits[contract] = contract_hits.get(contract, 0) + 1

          threshold = 0.80
          failed = []
          lines = []
          lines.append("| Contract | Coverage | Status |")
          lines.append("|----------|----------|--------|")
          for name in sorted(contract_total):
              total = contract_total[name]
              hits = contract_hits.get(name, 0)
              pct = (hits / total * 100) if total > 0 else 0
              rate = hits / total if total > 0 else 0
              status = "PASS" if rate >= threshold else "FAIL"
              icon = "pass" if status == "PASS" else "FAIL"
              lines.append(f"| `{name}` | {pct:.1f}% | {icon} |")
              if status == "FAIL":
                  failed.append(name)

          # Root element IS <coverage>; read overall rate directly from it.
          overall_rate = float(root.get("line-rate", "0")) * 100

          summary = "\n".join(lines)
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"overall={overall_rate:.1f}\n")
              f.write(f"failed_count={len(failed)}\n")
              delimiter = "EOF_SUMMARY"
              f.write(f"summary<<{delimiter}\n{summary}\n{delimiter}\n")
              if failed:
                  f.write(f"failed_names={', '.join(failed)}\n")

          if failed:
              print(f"Coverage below {threshold*100:.0f}% for: {', '.join(failed)}", file=sys.stderr)
          PYEOF

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage-report
          message: |
            ## Test Coverage Report

            **Overall line coverage:** ${{ steps.parse.outputs.overall }}%

            ${{ steps.parse.outputs.summary }}

            <sub>Generated by cargo-tarpaulin. Threshold: 80% per contract.</sub>

      - name: Enforce 80% threshold
        if: steps.parse.outputs.failed_count != '0'
        run: |
          echo "::error::Coverage below 80% for: ${{ steps.parse.outputs.failed_names }}"
          exit 1
