[package]
name = "test-framework"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[lib]
path = "framework/mod.rs"
doctest = false

[dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
staking     = { path = "../contracts/staking", features = ["testutils"] }
common      = { path = "../contracts/common", features = ["testutils"] }
proptest    = { version = "1" }

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }
ai_integration = { path = "../contracts/ai_integration" }
identity = { path = "../contracts/identity" }
key_manager = { path = "../contracts/key_manager" }
vision_records = { path = "../contracts/vision_records" }
access_control = { path = "../contracts/access_control" }

[[test]]
name = "cross_contract_integration"
path = "tests/integration/cross_contract.rs"

[[test]]
name = "access_control_integration"
path = "tests/access_control_integration.rs"
